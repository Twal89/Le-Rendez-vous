<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mémoriser">
<title>Mémoriser · حِفْظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0A1120; --or:#C9A227; --or-clair:#E3C365;
  --parchemin:#EAE0CB; --encre:#241C12; --vert:#2F6B52;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:max(16px, env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 50% -10%, #1B2C44 0%, var(--nuit) 55%, #060B14 100%);
  background-attachment:fixed;
  color:var(--parchemin);
  font-family:'EB Garamond', Georgia, serif;
}

header{ text-align:center; margin-bottom:10px; }
h1{
  font-family:'Cinzel', serif; font-size:12px; letter-spacing:.34em;
  text-transform:uppercase; color:var(--or); opacity:.85; margin:0; font-weight:600;
}
h1 .ar{ font-family:'Amiri', serif; font-size:17px; letter-spacing:0; }
#compteur{ font-size:14px; opacity:.5; margin:6px 0 0; font-style:italic; }

nav{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
.onglet{
  font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; padding:8px 14px; border-radius:999px;
  border:1px solid rgba(201,162,39,.28); background:transparent;
  color:rgba(234,224,203,.6); cursor:pointer; transition:all .25s;
}
.onglet:hover{ border-color:rgba(201,162,39,.6); color:var(--or-clair); }
.onglet.principal{ border-color:var(--or); color:var(--or-clair); background:rgba(201,162,39,.1); }
.onglet:focus-visible, .cmd:focus-visible, #scene:focus-visible, .ligne:focus-visible{
  outline:2px solid var(--or-clair); outline-offset:3px;
}

#scene{
  position:relative; width:100%; max-width:560px;
  height:clamp(380px, 62dvh, 620px); flex:0 0 auto;
  perspective:1600px; touch-action:none; cursor:grab;
}
#scene:active{ cursor:grabbing; }
#carte{ position:absolute; inset:0; transform-style:preserve-3d; }
#carte.anime{ transition:transform .62s cubic-bezier(.2,.75,.25,1); }

.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:20px; padding:24px 20px 18px; display:flex; flex-direction:column;
  justify-content:space-between; overflow:hidden;
  box-shadow:0 26px 60px rgba(0,0,0,.55);
}
#recto{
  background:linear-gradient(160deg,#16243A 0%,#0D1727 100%);
  border:1px solid rgba(201,162,39,.34);
}
#recto::after{
  content:''; position:absolute; inset:9px; border-radius:13px;
  border:1px solid rgba(201,162,39,.16); pointer-events:none;
}
#verso{
  transform:rotateY(180deg);
  background:linear-gradient(155deg,#F1E8D5 0%,var(--parchemin) 58%,#DCCFB4 100%);
  border:1px solid rgba(36,28,18,.22); color:var(--encre);
}

.eyebrow{
  font-family:'Cinzel', serif; font-size:10px; letter-spacing:.28em;
  text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;
  flex:0 0 auto; gap:10px;
}
#recto .eyebrow{ color:rgba(201,162,39,.75); }
#verso .eyebrow{ color:rgba(36,28,18,.5); }
.eyebrow .ar{ font-family:'Amiri', serif; font-size:18px; letter-spacing:0; }

.corps{
  flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
  overflow-y:auto; overscroll-behavior:contain; padding:10px 0;
}
#arabe{
  font-family:'Amiri','Scheherazade New','Geeza Pro','Traditional Arabic',serif;
  direction:rtl; text-align:center; color:#F7F1E3; margin:0; width:100%;
  line-height:1.95; text-shadow:0 1px 16px rgba(201,162,39,.16);
}
#francais{ text-align:center; margin:0; width:100%; line-height:1.55; color:var(--encre); }

.pied{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto; }
.indice{
  font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:.24em;
  text-transform:uppercase; opacity:.4; color:var(--parchemin);
}

.commandes{ display:flex; align-items:center; gap:10px; margin-top:16px; }
.cmd{
  font-family:'Cinzel',serif; font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  padding:11px 18px; border-radius:999px; cursor:pointer; transition:all .22s;
  border:1px solid rgba(201,162,39,.3); background:transparent; color:rgba(234,224,203,.72);
}
.cmd:hover{ border-color:var(--or); color:var(--or-clair); }
.cmd[data-actif="true"]{ background:var(--or); border-color:var(--or); color:#0A1120; }
.cmd[disabled]{ opacity:.25; cursor:default; }
.cmd[disabled]:hover{ border-color:rgba(201,162,39,.3); color:rgba(234,224,203,.72); }

#jauge{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:14px; max-width:560px; }
.perle{
  width:9px; height:9px; border-radius:50%; padding:0; cursor:pointer;
  border:1px solid rgba(201,162,39,.4); background:transparent; transition:all .2s;
}
.perle[data-courant="true"]{ transform:scale(1.55); border-color:var(--or-clair); }

#barre{ width:100%; max-width:560px; margin-top:16px; display:none; cursor:pointer; touch-action:none; }
#barre .rail{ height:14px; display:flex; align-items:center; }
#barre .fond{ height:3px; width:100%; background:rgba(201,162,39,.18); border-radius:2px; position:relative; }
#barre .jus{ position:absolute; inset:0 auto 0 0; background:var(--or); border-radius:2px; width:0%; }
#barre .tete{
  position:absolute; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px;
  border-radius:50%; background:var(--or-clair); left:0;
}
#barre .txt{
  font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
  opacity:.45; text-align:center; margin-top:6px;
}

.note{ font-size:12.5px; opacity:.33; margin:12px 0 0; text-align:center; font-style:italic; }
#alerte{
  max-width:560px; margin:0 0 12px; padding:10px 14px; border-radius:12px;
  border:1px solid rgba(201,162,39,.45); background:rgba(201,162,39,.08);
  font-size:13px; line-height:1.5; display:none; cursor:pointer;
}
#vide{ max-width:520px; text-align:center; margin-top:40px; line-height:1.7; opacity:.7; display:none; }
#vide code{ font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--or-clair); }

/* ---------- fenêtres ---------- */
.fenetre{
  position:fixed; inset:0; z-index:50; display:none; flex-direction:column;
  background:rgba(6,11,20,.97); backdrop-filter:blur(6px);
  padding:max(18px, env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
}
.fenetre.ouvert{ display:flex; }
.f-tete{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  max-width:600px; width:100%; margin:0 auto 14px;
}
.f-titre{
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:.3em; text-transform:uppercase;
  color:var(--or);
}
.f-corps{ max-width:600px; width:100%; margin:0 auto; overflow-y:auto; flex:1 1 auto; }
.ligne{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:14px; margin-bottom:6px; border-radius:12px; cursor:pointer;
  border:1px solid rgba(201,162,39,.16); background:transparent;
  color:var(--parchemin); font-family:'EB Garamond',serif; font-size:17px;
  transition:all .2s;
}
.ligne[data-actif="true"]{ border-color:rgba(201,162,39,.6); background:rgba(201,162,39,.1); }
.ligne .num{
  font-family:'Cinzel',serif; font-size:11px; opacity:.45; min-width:26px; flex:0 0 auto;
}
.ligne .nom{ flex:1 1 auto; }
.ligne .ar{ font-family:'Amiri',serif; font-size:20px; opacity:.75; }

/* ---------- saut ---------- */
#saut .f-corps{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
#champ{
  width:190px; text-align:center; background:transparent; color:var(--or-clair);
  border:none; border-bottom:1px solid rgba(201,162,39,.5);
  font-family:'Cinzel',serif; font-size:46px; letter-spacing:4px; padding:6px 0;
}
#champ:focus{ outline:none; border-bottom-color:var(--or); }
#saut .aide{ font-size:14px; opacity:.5; font-style:italic; text-align:center; }
#saut .actions{ display:flex; gap:10px; }

/* ---------- fond clair ---------- */
body[data-theme="clair"]{
  background:radial-gradient(120% 80% at 50% -10%, #FCF6E8 0%, #F1E6CF 55%, #E2D4B5 100%);
  background-attachment:fixed; color:#1A2A44;
}
body[data-theme="clair"] h1{ color:#9C7B14; opacity:1; }
body[data-theme="clair"] .onglet{ border-color:rgba(26,42,68,.22); color:rgba(26,42,68,.6); }
body[data-theme="clair"] .onglet:hover{ border-color:#9C7B14; color:#6E5608; }
body[data-theme="clair"] .onglet.principal{
  background:rgba(156,123,20,.15); border-color:#9C7B14; color:#6E5608;
}
body[data-theme="clair"] #verso{ border-color:rgba(26,42,68,.3); }
body[data-theme="clair"] .perle{ border-color:rgba(156,123,20,.5); }
body[data-theme="clair"] .perle[data-courant="true"]{ border-color:#6E5608; }
body[data-theme="clair"] .cmd{ border-color:rgba(26,42,68,.22); color:rgba(26,42,68,.7); }
body[data-theme="clair"] .cmd[data-actif="true"]{ background:#9C7B14; border-color:#9C7B14; color:#FCF6E8; }
body[data-theme="clair"] #barre .fond{ background:rgba(26,42,68,.14); }
body[data-theme="clair"] #barre .jus{ background:#9C7B14; }
body[data-theme="clair"] #barre .tete{ background:#8A6C10; }
body[data-theme="clair"] #alerte{ border-color:rgba(156,123,20,.55); background:rgba(156,123,20,.12); }
body[data-theme="clair"] .fenetre{ background:rgba(252,246,232,.97); }
body[data-theme="clair"] .f-titre{ color:#8A6C10; }
body[data-theme="clair"] .ligne{ color:#1A2A44; border-color:rgba(26,42,68,.18); }
body[data-theme="clair"] .ligne[data-actif="true"]{
  background:rgba(156,123,20,.13); border-color:rgba(156,123,20,.6);
}
body[data-theme="clair"] #champ{ color:#6E5608; border-bottom-color:rgba(156,123,20,.5); }
</style>
</head>
<body>

<header>
  <h1>Mémoriser · <span class="ar">حِفْظ</span></h1>
  <p id="compteur"></p>
</header>

<div id="alerte"></div>

<nav>
  <button class="onglet principal" id="btn-sourate">Sourate</button>
  <button class="onglet" id="btn-theme" aria-label="Changer de fond">☀</button>
</nav>

<div id="scene" role="button" tabindex="0" aria-label="Carte : glisse à l’horizontale pour retourner">
  <div id="carte">
    <div class="face" id="recto">
      <div class="eyebrow"><span id="r-sourate"></span><span class="ar" id="r-ar"></span></div>
      <div class="corps"><p id="arabe" lang="ar"></p></div>
      <div class="pied">
        <svg id="med-or" width="62" height="45" viewBox="0 0 100 72" aria-hidden="true"></svg>
        <span class="indice">Glisse pour retourner</span>
      </div>
    </div>
    <div class="face" id="verso">
      <div class="eyebrow"><span id="v-sourate"></span><span id="v-ref"></span></div>
      <div class="corps"><p id="francais"></p></div>
      <div class="pied">
        <svg id="med-vert" width="52" height="38" viewBox="0 0 100 72" aria-hidden="true"></svg>
      </div>
    </div>
  </div>
</div>

<div class="commandes">
  <button class="cmd" id="prec" aria-label="Verset précédent">&larr;</button>
  <button class="cmd" id="btn-saut">Aller au verset</button>
  <button class="cmd" id="suiv" aria-label="Verset suivant">&rarr;</button>
</div>

<div id="jauge"></div>
<div id="barre">
  <div class="rail"><div class="fond"><div class="jus"></div><div class="tete"></div></div></div>
  <div class="txt"></div>
</div>

<p class="note">Glisse à l’horizontale pour retourner la carte · vers le haut pour la suivante</p>

<div id="vide">
  <p>Aucun verset chargé.</p>
  <p>Ouvre le fichier <code>versets.js</code> et ajoute tes blocs, puis recharge la page.</p>
</div>

<!-- ---- choix de la sourate ---- -->
<div id="f-sourates" class="fenetre" role="dialog" aria-modal="true" aria-label="Choisir la sourate">
  <div class="f-tete">
    <span class="f-titre">Quelle sourate ?</span>
    <button class="onglet" data-fermer="f-sourates">Fermer</button>
  </div>
  <div class="f-corps" id="liste-sourates"></div>
</div>

<!-- ---- saut à un verset ---- -->
<div id="saut" class="fenetre" role="dialog" aria-modal="true" aria-label="Aller à un verset">
  <div class="f-tete">
    <span class="f-titre">Aller au verset</span>
    <button class="onglet" data-fermer="saut">Fermer</button>
  </div>
  <div class="f-corps">
    <input id="champ" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Numéro du verset">
    <p class="aide" id="aide-saut"></p>
    <div class="actions">
      <button class="onglet" id="saut-debut">Premier verset</button>
      <button class="onglet principal" id="saut-ok">Y aller</button>
    </div>
  </div>
</div>

<script src="versets.js"></script>
<script>

["Al-Fātiḥa","الفاتحة"],["Al-Baqara","البقرة"],["Āl ʿImrān","آل عمران"],["An-Nisāʾ","النساء"],

["An-Naml","النمل"],["Al-Qaṣaṣ","القصص"],["Al-ʿAnkabūt","العنكبوت"],["Ar-Rūm","الروم"],
["Luqmān","لقمان"],["As-Sajda","السجدة"],["Al-Aḥzāb","الأحزاب"],["Sabaʾ","سبأ"],["Fāṭir","فاطر"],
["Yā-Sīn","يس"],["Aṣ-Ṣāffāt","الصافات"],["Ṣād","ص"],["Az-Zumar","الزمر"],["Ghāfir","غافر"],
["Fuṣṣilat","فصلت"],["Ash-Shūrā","الشورى"],["Az-Zukhruf","الزخرف"],["Ad-Dukhān","الدخان"],
["Al-Jāthiya","الجاثية"],["Al-Aḥqāf","الأحقاف"],["Muḥammad","محمد"],["Al-Fatḥ","الفتح"],

["An-Najm","النجم"],["Al-Qamar","القمر"],["Ar-Raḥmān","الرحمن"],["Al-Wāqiʿa","الواقعة"],
["Al-Ḥadīd","الحديد"],["Al-Mujādala","المجادلة"],["Al-Ḥashr","الحشر"],["Al-Mumtaḥana","الممتحنة"],
["Aṣ-Ṣaff","الصف"],["Al-Jumuʿa","الجمعة"],["Al-Munāfiqūn","المنافقون"],["At-Taghābun","التغابن"],

["Aḍ-Ḍuḥā","الضحى"],["Ash-Sharḥ","الشرح"],["At-Tīn","التين"],["Al-ʿAlaq","العلق"],
["Al-Qadr","القدر"],["Al-Bayyina","البينة"],["Az-Zalzala","الزلزلة"],["Al-ʿĀdiyāt","العاديات"],
["Al-Qāriʿa","القارعة"],["At-Takāthur","التكاثر"],["Al-ʿAṣr","العصر"],["Al-Humaza","الهمزة"],

["Al-Kāfirūn","الكافرون"],["An-Naṣr","النصر"],["Al-Masad","المسد"],["Al-Ikhlāṣ","الإخلاص"],
["Al-Falaq","الفلق"],["An-Nās","الناس"]
];
const nomFr = function(s){ return SOURATES[s] ? SOURATES[s][0] : "Sourate " + s; };
const nomAr = function(s){ return SOURATES[s] ? SOURATES[s][1] : ""; };

/* =================================================================
   2. Lecture du fichier versets.js
   ================================================================= */
function analyser(texte){
  const versets = [], erreurs = [];
  const blocs = String(texte || "").split(/\n\s*\n/);
  blocs.forEach(function(bloc){
    const lignes = bloc.split("\n").map(function(l){ return l.trim(); })
                       .filter(function(l){ return l && l.charAt(0) !== "#"; });
    if (!lignes.length) return;

    const ref = lignes[0].match(/^(\d{1,3})\s*[:.\-\s]\s*(\d{1,3})$/);
    if (!ref) { erreurs.push("Référence illisible : « " + lignes[0].slice(0, 40) + " »"); return; }
    const s = +ref[1], a = +ref[2];
    if (s < 1 || s > 114) { erreurs.push("Numéro de sourate hors limites : " + s); return; }

    let champ = null, ar = [], fr = [];
    for (let k = 1; k < lignes.length; k++){
      const l = lignes[k];
      if (/^ar\s*:/i.test(l))      { champ = "ar"; ar.push(l.replace(/^ar\s*:/i, "").trim()); }
      else if (/^fr\s*:/i.test(l)) { champ = "fr"; fr.push(l.replace(/^fr\s*:/i, "").trim()); }
      else if (champ === "ar")     { ar.push(l); }
      else if (champ === "fr")     { fr.push(l); }
    }
    const A = ar.join(" ").trim(), F = fr.join(" ").trim();
    if (!A) { erreurs.push(s + ":" + a + " — ligne « ar: » manquante ou vide"); return; }
    if (!F) { erreurs.push(s + ":" + a + " — ligne « fr: » manquante ou vide"); return; }
    versets.push({ s:s, a:a, ar:A, fr:F });
  });
  return { versets: versets, erreurs: erreurs };
}

/* =================================================================
   3. État
   ================================================================= */
const CLE_REGL = "coran:reglages";
const $ = function(id){ return document.getElementById(id); };
const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let reglages = { clair: false };
try { Object.assign(reglages, JSON.parse(localStorage.getItem(CLE_REGL) || "{}")); } catch(e) {}
document.body.dataset.theme = reglages.clair ? "clair" : "nuit";

let lu = { versets: [], erreurs: [] };
let PAR_SOURATE = {}, NUMEROS = [];
let sCourante = null, session = [], i = 0;
let retourne = false, drag = 0, enCours = false;

function sauver(){
  try { localStorage.setItem(CLE_REGL, JSON.stringify(reglages)); } catch(e) {}
}

/* =================================================================
   4. Rendu
   ================================================================= */
function medaillon(svg, n, couleur){
  svg.innerHTML =
    '<g fill="none" stroke="'+couleur+'" stroke-width="1.6" opacity="0.9">' +
      '<path d="M20 6 H80 L94 36 L80 66 H20 L6 36 Z"/>' +
      '<path d="M24 12 H76 L87 36 L76 60 H24 L13 36 Z" opacity="0.55" stroke-dasharray="5 4"/>' +
      '<rect x="38" y="4" width="24" height="6" rx="3" fill="'+couleur+'" stroke="none"/>' +
      '<rect x="38" y="62" width="24" height="6" rx="3" fill="'+couleur+'" stroke="none"/>' +
    '</g>' +
    '<text x="50" y="46" text-anchor="middle" font-size="30" fill="'+couleur+'" ' +
    'style="font-family:\'Cinzel\',serif;letter-spacing:1px">' + n + '</text>';
}

function ajuster(p, max, min){
  const boite = p.parentElement;
  let t = max, garde = 0;
  p.style.fontSize = t + "px";
  while (t > min && garde++ < 300 &&
        (p.scrollHeight > boite.clientHeight - 2 || p.scrollWidth > boite.clientWidth)){
    t -= 1; p.style.fontSize = t + "px";
  }
}
function ajusterTout(){
  const l = Math.min($("scene").clientWidth, 560);
  ajuster($("arabe"), Math.round(l * 0.185), 18);
  ajuster($("francais"), Math.round(l * 0.075), 14);
}

function appliquer(){
  $("carte").style.transform = "rotateY(" + ((retourne ? 180 : 0) + drag) + "deg)";
}

function rendreProgression(){
  const total = session.length;
  if (total <= 45){
    $("barre").style.display = "none";
    $("jauge").style.display = "flex";
    $("jauge").innerHTML = "";
    session.forEach(function(c, k){
      const b = document.createElement("button");
      b.className = "perle";
      b.setAttribute("aria-label", "Verset " + c.a);
      if (k === i) b.dataset.courant = "true";
      b.onclick = function(){ i = k; retourne = false; rendre(); };
      $("jauge").appendChild(b);
    });
  } else {
    $("jauge").style.display = "none";
    $("barre").style.display = "block";
    const r = total > 1 ? i / (total - 1) : 0;
    $("barre").querySelector(".jus").style.width = (r * 100) + "%";
    $("barre").querySelector(".tete").style.left = (r * 100) + "%";
    $("barre").querySelector(".txt").textContent = "verset " + session[i].a + " · " + (i + 1) + " / " + total;
  }
}

function rendre(){
  if (!session.length){
    $("vide").style.display = "block";
    $("scene").style.display = "none";
    return;
  }
  $("vide").style.display = "none";
  $("scene").style.display = "block";

  const c = session[i];
  $("r-sourate").textContent = "Sourate " + c.s + " · verset " + c.a;
  $("r-ar").textContent = nomAr(c.s);
  $("arabe").textContent = c.ar;
  $("v-sourate").textContent = nomFr(c.s);
  $("v-ref").textContent = c.s + ":" + c.a;
  $("francais").textContent = c.fr;
  medaillon($("med-or"), c.a, "#C9A227");
  medaillon($("med-vert"), c.a, "#2F6B52");

  $("compteur").textContent = nomFr(c.s) + " · verset " + c.a + " sur " +
                              session[session.length - 1].a;
  $("btn-sourate").textContent = nomFr(c.s);
  $("btn-theme").textContent = reglages.clair ? "☾" : "☀";
  $("prec").disabled = (i === 0);
  $("suiv").disabled = (i === session.length - 1);

  rendreProgression();
  appliquer();
  requestAnimationFrame(ajusterTout);
}

/* =================================================================
   5. Navigation
   ================================================================= */
function aller(d){
  if (!session.length) return;
  const n = Math.min(Math.max(i + d, 0), session.length - 1);
  if (n === i) return;
  i = n; retourne = false; drag = 0;
  rendre();
}

function ouvrirSourate(s, verset){
  sCourante = s;
  session = PAR_SOURATE[s] || [];
  i = 0;
  if (verset != null){
    for (let k = 0; k < session.length; k++){
      if (session[k].a >= verset){ i = k; break; }
      if (k === session.length - 1) i = k;
    }
  }
  retourne = false; drag = 0;
  rendre();
}

function basculer(){ retourne = !retourne; appliquer(); }

$("prec").onclick = function(){ aller(-1); };
$("suiv").onclick = function(){ aller(1); };
$("btn-theme").onclick = function(){
  reglages.clair = !reglages.clair;
  document.body.dataset.theme = reglages.clair ? "clair" : "nuit";
  sauver(); rendre();
};

document.addEventListener("keydown", function(e){
  const f = document.querySelector(".fenetre.ouvert");
  if (f){
    if (e.key === "Escape") fermer(f.id);
    else if (e.key === "Enter" && f.id === "saut") validerSaut();
    return;
  }
  if (e.key === "ArrowRight" || e.key === "ArrowDown") aller(1);
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") aller(-1);
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); basculer(); }
});

/* ---- gestes sur la carte ---- */
const scene = $("scene");
let p0 = { x:0, y:0, axe:null };
scene.addEventListener("pointerdown", function(e){
  p0 = { x:e.clientX, y:e.clientY, axe:null };
  enCours = true;
  $("carte").classList.remove("anime");
  scene.setPointerCapture(e.pointerId);
});
scene.addEventListener("pointermove", function(e){
  if (!enCours) return;
  const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
  if (!p0.axe && Math.hypot(dx, dy) > 10) p0.axe = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (p0.axe === "x"){ drag = Math.max(-175, Math.min(175, dx * 0.55)); appliquer(); }
});
function relacher(e){
  if (!enCours) return;
  enCours = false;
  const dx = e.clientX - p0.x, dy = e.clientY - p0.y, axe = p0.axe;
  drag = 0;
  if (!reduit) $("carte").classList.add("anime");
  if (axe === "y" && Math.abs(dy) > 60) aller(dy < 0 ? 1 : -1);
  else if (axe === "x" && Math.abs(dx) > 55) basculer();
  else if (Math.hypot(dx, dy) < 10) basculer();
  else appliquer();
}
scene.addEventListener("pointerup", relacher);
scene.addEventListener("pointercancel", relacher);
window.addEventListener("resize", ajusterTout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusterTout);

/* ---- glissement sur la barre de progression ---- */
(function(){
  const b = $("barre");
  let actif = false;
  const placer = function(e){
    const r = b.querySelector(".fond").getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
    const n = Math.round(ratio * (session.length - 1));
    if (n !== i){ i = n; retourne = false; rendre(); }
  };
  b.addEventListener("pointerdown", function(e){
    actif = true; b.setPointerCapture(e.pointerId); placer(e);
  });
  b.addEventListener("pointermove", function(e){ if (actif) placer(e); });
  b.addEventListener("pointerup", function(){ actif = false; });
  b.addEventListener("pointercancel", function(){ actif = false; });
})();

/* =================================================================
   6. Fenêtres
   ================================================================= */
function ouvrir(id){ $(id).classList.add("ouvert"); }
function fermer(id){ $(id).classList.remove("ouvert"); }
document.querySelectorAll("[data-fermer]").forEach(function(b){
  b.onclick = function(){ fermer(b.dataset.fermer); };
});

$("btn-sourate").onclick = function(){
  const liste = $("liste-sourates");
  liste.innerHTML = "";
  NUMEROS.forEach(function(s){
    const b = document.createElement("button");
    b.className = "ligne";
    if (s === sCourante) b.dataset.actif = "true";
    b.innerHTML = '<span class="num">' + s + '</span>' +
                  '<span class="nom">' + nomFr(s) + '</span>' +
                  '<span class="compte">' + PAR_SOURATE[s].length + '</span>' +
                  '<span class="ar">' + nomAr(s) + '</span>';
    b.onclick = function(){
      fermer("f-sourates");
      ouvrirSourate(s, 1);
    };
    liste.appendChild(b);
  });
  ouvrir("f-sourates");
};

function validerSaut(){
  const v = parseInt($("champ").value, 10);
  if (!isNaN(v)) ouvrirSourate(sCourante, v);
  fermer("saut");
}
$("btn-saut").onclick = function(){
  if (!session.length) return;
  $("aide-saut").textContent = nomFr(sCourante) + " · versets " +
                               session[0].a + " à " + session[session.length - 1].a + " chargés";
  $("champ").value = "";
  ouvrir("saut");
  setTimeout(function(){ $("champ").focus(); }, 60);
};
$("saut-ok").onclick = validerSaut;
$("saut-debut").onclick = function(){ ouvrirSourate(sCourante, 1); fermer("saut"); };

/* =================================================================
   7. Démarrage
   ================================================================= */
function chargerContenu(){
  return fetch("versets.js?t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(brut){
      const d = brut.indexOf("`"), f = brut.lastIndexOf("`");
      if (d !== -1 && f > d) return brut.slice(d + 1, f);
      throw new Error("format");
    })
    .catch(function(){ return window.VERSETS || ""; });
}

function demarrer(texte){
  lu = analyser(texte);
  PAR_SOURATE = {};
  lu.versets.forEach(function(v){ (PAR_SOURATE[v.s] = PAR_SOURATE[v.s] || []).push(v); });
  NUMEROS = Object.keys(PAR_SOURATE).map(Number).sort(function(a, b){ return a - b; });
  NUMEROS.forEach(function(s){
    PAR_SOURATE[s].sort(function(x, y){ return x.a - y.a; });
  });

  if (lu.erreurs.length){
    const a = $("alerte");
    a.style.display = "block";
    a.textContent = lu.erreurs.length + " bloc" + (lu.erreurs.length > 1 ? "s" : "") +
                    " ignoré" + (lu.erreurs.length > 1 ? "s" : "") + " dans versets.js — toucher pour voir le détail";
    a.onclick = function(){ a.textContent = lu.erreurs.join(" · "); };
  }
  if (!reduit) $("carte").classList.add("anime");

  if (!NUMEROS.length){ rendre(); return; }
  ouvrirSourate(NUMEROS[0], 1);
}

chargerContenu().then(demarrer);
</script>
</body>
